name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run: both SUTs are live sites that can change without notice.
    # Catch drift (and refresh the published report) without a push.
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

# Every browser job runs inside the official Playwright image, the same one
# that generates the visual baselines (update-baselines.yml). Keep the tag in
# sync with @playwright/test in package.json; FW-UNIT-002 enforces it.

jobs:
  unit:
    name: Type-check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      # AI parser + framework guards. No ANTHROPIC_API_KEY anywhere in CI:
      # the AI module is optional and never called here.
      - name: Unit tests
        run: npx playwright test --project=unit

  saucedemo:
    name: SauceDemo (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      HOME: /root # run as the image's root user; Firefox needs a HOME it owns
      BLOB_NAME: saucedemo-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # chromium also runs the visual (SAUCE-VIS) and accessibility (SAUCE-A11Y) specs.
      - name: Run SauceDemo tests
        run: npx playwright test --project=saucedemo-${{ matrix.browser }}
      - name: Triage failures
        if: ${{ !cancelled() }}
        run: npx triage triage-input.json --out triage-output
      - name: Upload triage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: triage-report-saucedemo-${{ matrix.browser }}
          path: triage-output/
          retention-days: 14
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-saucedemo-${{ matrix.browser }}
          path: blob-report/
          retention-days: 14

  menu-escolar:
    # Production app used by families: one job, ONE worker for both projects,
    # so at most a single browser page talks to it at any time. No load tests,
    # no writes (enforced in tests/menu-escolar/fixtures/fixtures.ts).
    name: menu-escolar (mobile Chromium + WebKit)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    env:
      HOME: /root
      BLOB_NAME: menu-escolar
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Run menu-escolar tests
        run: npx playwright test --project=menu-escolar-chromium --project=menu-escolar-webkit --workers=1
      - name: Triage failures
        if: ${{ !cancelled() }}
        run: npx triage triage-input.json --out triage-output
      - name: Upload triage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: triage-report-menu-escolar
          path: triage-output/
          retention-days: 14
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-menu-escolar
          path: blob-report/
          retention-days: 14

  # Merge the per-job blob reports into one HTML report and publish it to
  # GitHub Pages (main only) so it can be linked as a live report.
  merge-and-deploy:
    name: Merge reports & publish
    needs: [saucedemo, menu-escolar]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # required by download-artifact
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
